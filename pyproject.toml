[project]
name = "modemon"
version = "0.1.0"
description = "Modemon 模灵 —— 自研数学建模智能体：赛题解析 → 建模设计 → 求解真实执行 → 图表 → 论文成文，编译自动回修 + 数值溯源门禁"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=12.0"]
solve = ["numpy>=1.26", "matplotlib>=3.8", "pandas>=2.2", "scipy>=1.13"]
dev = ["pytest>=8.0"]

[project.scripts]
modemon = "modemon.cli:main"
mma = "modemon.cli:main"   # 短别名：历史文档里的 mma 命令继续可用

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modemon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
