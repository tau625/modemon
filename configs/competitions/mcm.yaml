id: mcm
name: MCM/ICM（美赛）
language: en
page_limit: 25
min_pages: 18
min_figures: 3
abstract_first: true
required_sections:
  - Summary Sheet
  - Introduction
  - Assumptions and Justifications
  - Notations
  - Model Development
  - Results and Sensitivity Analysis
  - Model Evaluation and Strengths/Weaknesses
  - References
  - Appendices
notes:
